name: Atualizar lista M3U Adultos

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar playlist
        run: python gerar_m3u.py

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add adultos.m3u status.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração na playlist."
          else
            git commit -m "Atualizar playlist adultos"
            git push
          fi
